<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>琦香缘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Noto Serif SC', '华文楷体', '楷体', KaiTi, 'Microsoft YaHei', serif;
      background: #fef7e9;
      background-image: radial-gradient(circle at 20% 30%, rgba(255,220,180,0.3) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      transition: all 0.2s ease;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      height: 85vh;
      max-height: 800px;
      background: #fffbf2;
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      box-shadow: 0 30px 50px rgba(160, 100, 60, 0.25), 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 215, 150, 0.5);
    }

    .view {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      padding: 1.8rem 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: #e6b17e #faead7;
    }

    .view.active {
      display: flex;
    }

    .view::-webkit-scrollbar {
      width: 5px;
    }
    .view::-webkit-scrollbar-track {
      background: #faead7;
      border-radius: 10px;
    }
    .view::-webkit-scrollbar-thumb {
      background: #e6b17e;
      border-radius: 10px;
    }

    /* 首页 */
    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 2rem;
    }

    .welcome-icon {
      font-size: 5rem;
      filter: drop-shadow(0 12px 12px rgba(180, 90, 30, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      color: #a3431c;
      text-shadow: 2px 2px 0 rgba(255, 200, 120, 0.4);
      letter-spacing: 4px;
      line-height: 1.3;
    }

    .welcome-sub {
      font-size: 1.2rem;
      color: #b66b3c;
      background: rgba(255, 245, 225, 0.8);
      padding: 0.5rem 2rem;
      border-radius: 40px;
      font-style: italic;
    }

    .enter-btn {
      background: #d9512c;
      border: none;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 0.9rem 2.8rem;
      border-radius: 3rem;
      cursor: pointer;
      box-shadow: 0 12px 20px rgba(200, 80, 30, 0.4);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #e5622c, #b93a1a);
      border: 1px solid #ffb28b;
      margin-top: 0.8rem;
    }

    .enter-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 18px 25px rgba(210, 70, 20, 0.5);
      background: linear-gradient(135deg, #f2713a, #c54420);
    }

    .enter-btn:active {
      transform: scale(0.97);
    }

    /* 返回行 */
    .back-row {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #b45f3a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.3rem 0.5rem;
      border-radius: 2rem;
      transition: background 0.2s;
      margin-right: 0.5rem;
    }

    .back-btn:hover {
      background: #fbe5d3;
    }

    .section-title {
      font-size: 1.9rem;
      font-weight: 650;
      color: #933e1f;
      margin-left: 0.3rem;
    }

    /* 中间导航页按钮 */
    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 2rem;
    }

    .nav-btn {
      background: #fff3e6;
      border: 2px solid #e5ae7c;
      color: #7b4a2c;
      padding: 1.2rem 1.5rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      background: #fffaf2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .nav-btn:hover {
      background: #fddbb8;
      border-color: #c5682c;
      transform: scale(1.02);
    }

    /* 产品列表 */
    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 0.6rem;
    }

    .product-card {
      background: #ffffff;
      border-radius: 2.2rem;
      padding: 1.2rem;
      box-shadow: 0 15px 25px rgba(170, 100, 40, 0.18);
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid #ffe0c0;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 30px rgba(180, 90, 30, 0.25);
      background: #fffaf2;
    }

    .product-img {
      width: 80px;
      height: 80px;
      background: #fde6d2;
      border-radius: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #fff2e0, #fbc79e);
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.05);
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #7b3c1c;
    }

    .product-desc {
      color: #bf7a54;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* 其他内容页 */
    .other-content {
      text-align: center;
      padding: 2rem 1rem;
      color: #7b4a2c;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .other-content h2 {
      font-size: 2rem;
      color: #a3431c;
      margin-bottom: 1rem;
    }

    .other-content .info-card {
      background: #fffbf5;
      border-radius: 2rem;
      padding: 1.5rem;
      margin: 1rem 0;
      border: 1px solid #f3d5b5;
      text-align: left;
      line-height: 1.8;
    }

    /* 产品详情页 */
    .detail-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.8rem;
    }

    .detail-icon {
      width: 70px;
      height: 70px;
      overflow: hidden;
      background: #fbe6d0;
      border-radius: 2rem;
      padding: 0.5rem;
    }

    .detail-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1.5rem;
    }

    .detail-name {
      font-size: 2.2rem;
      font-weight: bold;
      color: #933e1f;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin: 1.5rem 0 1rem;
    }

    .tab-btn {
      background: #ffeada;
      border: 1px solid #e5ae7c;
      color: #7b4a2c;
      padding: 0.7rem 1.5rem;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: #fff3e6;
    }

    .tab-btn:hover {
      background: #fddbb8;
      border-color: #c5682c;
    }

    .tab-btn.active {
      background: #c2552c;
      border-color: #a3431c;
      color: white;
      box-shadow: 0 6px 12px rgba(180, 70, 10, 0.4);
    }

    .detail-content-box {
      background: #fffbf5;
      border-radius: 2rem;
      padding: 1.3rem 1.2rem;
      margin-top: 0.5rem;
      box-shadow: inset 0 2px 10px rgba(190, 130, 70, 0.15);
      border: 1px solid #f3d5b5;
      min-height: 140px;
      color: #4d2e1b;
      font-size: 1rem;
      line-height: 1.7;
      white-space: pre-wrap;
      transition: 0.2s;
    }

    .extra-note {
      margin-top: 1rem;
      font-style: italic;
      color: #b3643a;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- 首页 -->
  <div id="homeView" class="view active">
    <div class="welcome-content">
      <div class="welcome-icon">✨</div>
      <h1>琦香缘</h1>
      <div class="welcome-sub">宣传语</div>
      <button class="enter-btn" id="enterDetailBtn">
        <span>进入详情</span>
      </button>
      <div style="font-size: 0.9rem; color: #bc7a5c; margin-top: 0.2rem;">点击开启美食之旅</div>
    </div>
  </div>

  <!-- 导航中间页 -->
  <div id="navView" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToHomeFromNavBtn">← 返回</button>
      <span class="section-title">探索琦香缘</span>
    </div>
    <div class="nav-grid">
      <button class="nav-btn" id="toClassBtn">
        <span>🍡</span> 我们的产品
      </button>
      <button class="nav-btn" id="toOtherPageABtn">
        <span>📖</span> 为什么选我们
      </button>
      <button class="nav-btn" id="toOtherPageBBtn">
        <span>📍</span> 联系我们
      </button>
    </div>
  </div>

  <!-- 分类选择页 -->
<div id="classView" class="view">
  <div class="back-row">
    <button class="back-btn" id="backToNavFromClassBtn">← 返回</button>
    <span class="section-title">选择分类</span>
  </div>
  <div class="nav-grid" id="categoryButtons"></div>
</div>

  <!-- 产品列表页 -->
  <div id="listView" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToNavBtn">← 返回</button>
      <span class="section-title">我们的产品</span>
    </div>
    <div style="margin: 1rem 0 1.2rem;">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 搜索产品..." 
        style="width:100%; padding:0.8rem 1.2rem; border:1px solid #e5ae7c; border-radius:2rem; font-size:1rem; background:#fffbf5; color:#7b4a2c; outline:none;"
      >
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- 其他内容页A - 为什么选我们 -->
  <div id="otherViewA" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToNavFromABtn">← 返回</button>
      <span class="section-title">为什么选我们</span>
    </div>
    <div class="other-content">
      <h2>📖 因为我们选用真材实料</h2>
      <div class="info-card">
        <img src="https://melo-0216.github.io/food/images/门店照片.jpg" 
             style="width:100%; border-radius:1rem; margin-bottom:1rem;">
        <p>1</p>
        <p>2</p>
        <p>3</p>
      </div>
    </div>
  </div>

  <!-- 其他内容页B - 联系我们 -->
  <div id="otherViewB" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToNavFromBBtn">← 返回</button>
      <span class="section-title">联系我们</span>
    </div>
    <div class="other-content">
      <h2>📍 找到我们</h2>
      <div class="info-card">
        <p>📞 电话：xxxx-xxxx</p>
        <p>📍 地址：XX市XX区XX路XX号</p>
      </div>
    </div>
  </div>

  <!-- 产品详情页 -->
  <div id="detailView" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToListBtn">← 返回</button>
      <span class="section-title" id="detailTitle">产品详情</span>
    </div>
    <div class="detail-header">
      <span class="detail-icon" id="detailEmoji">✨</span>
      <span class="detail-name" id="detailProductName">产品详情</span>
    </div>
    <div class="button-group" id="tabButtonGroup"></div>
    <div class="detail-content-box" id="detailContentText">请点击上方按钮查看介绍</div>
    <div class="extra-note"><span>✨</span> 纯天然·无添加</div>
  </div>
</div>

<script>
  (function() {
    const products = [
      { id: 1, 
      name: '牛杂汤', 
      category: '汤类',
      img: 'https://example.com/1.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 2,

    },

      category: '汤类',
      img: 'https://example.com/3.jpg',

    },
      { id: 4, 
      name: '满碗肉', 
      category: '汤类',
      img: 'https://example.com/4.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 5, 
      name: '精品全牛', 
      category: '汤类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
        { id: 6, 
      name: '炸酱拌面', 
      category: '面类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 7, 
      name: '葱油拌面', 
      category: '面类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 8, 
      name: '麻辣牛肉面', 
      category: '面类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 9, 
      name: '牛大骨小面', 
      category: '面类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 10, 
      name: '生烫牛肉粉', 
      category: '粉类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 11, 
      name: '牛肉拌粉面', 
      category: '粉类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 12, 
      name: '炸酱拌粉面', 
      category: '粉类',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 13, 
      name: '贵妃千层饼', 
      category: '主食',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 14, 
      name: '牛肉烧饼', 
      category: '主食',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 15, 
      name: '五香芝麻饼', 
      category: '主食',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 16, 
      name: '酱香饼', 
      category: '主食',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    },
      { id: 17, 
      name: '鸡蛋饼', 
      category: '主食',
      img: 'https://example.com/5.jpg', 
      desc: '特色描述', 
      details: { '原料': '...', '做法': '...', '口感': '...' } 
    }
    ];

    let currentProductId = 1;
    let currentCategory = null;
  
    const homeView = document.getElementById('homeView');
    const navView = document.getElementById('navView');
    const classView = document.getElementById('classView');
    const listView = document.getElementById('listView');
    const otherViewA = document.getElementById('otherViewA');
    const otherViewB = document.getElementById('otherViewB');
    const detailView = document.getElementById('detailView');

    function showView(viewElement) {
      [homeView, navView, classView, listView, otherViewA, otherViewB, detailView].forEach(v => v.classList.remove('active'));
      viewElement.classList.add('active');
    }

    // 渲染分类按钮
    function renderCategoryButtons() {
      const container = document.getElementById('categoryButtons');
      if (!container) return;
      const categories = [...new Set(products.map(p => p.category))];
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'nav-btn';
      allBtn.innerHTML = '<span>🌟</span> 全部产品';
      allBtn.addEventListener('click', () => {
        currentCategory = null;
        renderProductList();
        showView(listView);
      });
      container.appendChild(allBtn);

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.innerHTML = `<span>📌</span> ${cat}`;
        btn.addEventListener('click', () => {
          currentCategory = cat;
          renderProductList();
          showView(listView);
        });
        container.appendChild(btn);
      });
    }

    // 渲染产品列表（支持分类筛选+搜索）
    function renderProductList(filterText = '') {
      const productGrid = document.getElementById('productGrid');
      if (!productGrid) return;
      productGrid.innerHTML = '';
      const filtered = products.filter(p => {
        if (currentCategory && p.category !== currentCategory) return false;
        if (!filterText) return true;
        return p.name.includes(filterText) || p.desc.includes(filterText);
      });
      if (filtered.length === 0) {
        productGrid.innerHTML = '<div style="text-align:center;padding:2rem;color:#bf7a54;">😕 没有找到相关产品</div>';
        return;
      }
      filtered.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-img"><img src="${product.img}" alt="${product.name}"></div>
          <div class="product-info"><div class="product-name">${product.name}</div><div class="product-desc">${product.desc}</div></div>
          <div style="font-size:1.5rem;color:#c2845c;">›</div>
        `;
        card.addEventListener('click', () => openProductDetail(product.id));
        productGrid.appendChild(card);
      });
    }

    function getProductById(id) {
      return products.find(p => p.id === id) || products[0];
    }

    function openProductDetail(productId) {
      const product = getProductById(productId);
      if (!product) return;
      currentProductId = productId;
      document.getElementById('detailEmoji').innerHTML = `<img src="${product.img}" alt="${product.name}">`;
      document.getElementById('detailProductName').textContent = product.name;
      renderDetailTabs(product);
      document.getElementById('detailContentText').textContent = '请点击上方按钮查看详细介绍';
      showView(detailView);
    }

    function renderDetailTabs(product) {
      const group = document.getElementById('tabButtonGroup');
      if (!group) return;
      group.innerHTML = '';
      Object.keys(product.details).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.textContent = key;
        btn.addEventListener('click', function() {
          group.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('detailContentText').textContent = product.details[key] || '暂无您说的美食介绍';
        });
        group.appendChild(btn);
      });
    }

    // 搜索
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', e => renderProductList(e.target.value));
    }

    // 事件绑定
    document.getElementById('enterDetailBtn').addEventListener('click', () => showView(navView));
    document.getElementById('backToHomeFromNavBtn').addEventListener('click', () => showView(homeView));

    // 导航 → 分类页
    document.getElementById('toClassBtn').addEventListener('click', () => {
      renderCategoryButtons();
      showView(classView);
    });

    document.getElementById('toOtherPageABtn').addEventListener('click', () => showView(otherViewA));
    document.getElementById('toOtherPageBBtn').addEventListener('click', () => showView(otherViewB));

    // 分类页 → 导航
    document.getElementById('backToNavFromClassBtn').addEventListener('click', () => showView(navView));

    // 产品列表 → 分类页
    document.getElementById('backToNavBtn').addEventListener('click', () => showView(classView));

    document.getElementById('backToNavFromABtn').addEventListener('click', () => showView(navView));
    document.getElementById('backToNavFromBBtn').addEventListener('click', () => showView(navView));
    document.getElementById('backToListBtn').addEventListener('click', () => showView(listView));

    renderProductList();
  })();
</script>
</body>
