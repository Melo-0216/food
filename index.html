<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>琦香缘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Noto Serif SC', '华文楷体', '楷体', KaiTi, 'Microsoft YaHei', serif;
      background: #fef7e9;
      background-image: radial-gradient(circle at 20% 30%, rgba(255,220,180,0.3) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      transition: all 0.2s ease;
    }

    /* 主容器，模拟页面卡片效果 */
    .app-container {
      width: 100%;
      max-width: 500px;
      height: 85vh;
      max-height: 800px;
      background: #fffbf2;
      border-radius: 3rem 3rem 2.5rem 2.5rem;
      box-shadow: 0 30px 50px rgba(160, 100, 60, 0.25), 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 215, 150, 0.5);
    }

    /* 页面滑动区域 */
    .view {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      padding: 1.8rem 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: #e6b17e #faead7;
    }

    .view.active {
      display: flex;
    }

    .view::-webkit-scrollbar {
      width: 5px;
    }
    .view::-webkit-scrollbar-track {
      background: #faead7;
      border-radius: 10px;
    }
    .view::-webkit-scrollbar-thumb {
      background: #e6b17e;
      border-radius: 10px;
    }

    /* ===== 首页欢迎词 ===== */
    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 2rem;
    }

    .welcome-icon {
      font-size: 5rem;
      filter: drop-shadow(0 12px 12px rgba(180, 90, 30, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      color: #a3431c;
      text-shadow: 2px 2px 0 rgba(255, 200, 120, 0.4);
      letter-spacing: 4px;
      line-height: 1.3;
    }

    .welcome-sub {
      font-size: 1.2rem;
      color: #b66b3c;
      background: rgba(255, 245, 225, 0.8);
      padding: 0.5rem 2rem;
      border-radius: 40px;
      font-style: italic;
    }

    .enter-btn {
      background: #d9512c;
      border: none;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 0.9rem 2.8rem;
      border-radius: 3rem;
      cursor: pointer;
      box-shadow: 0 12px 20px rgba(200, 80, 30, 0.4);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #e5622c, #b93a1a);
      border: 1px solid #ffb28b;
      margin-top: 0.8rem;
    }

    .enter-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 18px 25px rgba(210, 70, 20, 0.5);
      background: linear-gradient(135deg, #f2713a, #c54420);
    }

    .enter-btn:active {
      transform: scale(0.97);
    }

    /* ===== 详情页（产品列表） ===== */
    .back-row {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #b45f3a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.3rem 0.5rem;
      border-radius: 2rem;
      transition: background 0.2s;
      margin-right: 0.5rem;
    }

    .back-btn:hover {
      background: #fbe5d3;
    }

    .section-title {
      font-size: 1.9rem;
      font-weight: 650;
      color: #933e1f;
      margin-left: 0.3rem;
    }

    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 0.6rem;
    }

    .product-card {
      background: #ffffff;
      border-radius: 2.2rem;
      padding: 1.2rem;
      box-shadow: 0 15px 25px rgba(170, 100, 40, 0.18);
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid #ffe0c0;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 30px rgba(180, 90, 30, 0.25);
      background: #fffaf2;
    }

    .product-img {
      width: 80px;
      height: 80px;
      background: #fde6d2;
      border-radius: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      background: radial-gradient(circle at 30% 30%, #fff2e0, #fbc79e);
      box-shadow: inset 0 -4px 6px rgba(0,0,0,0.05);
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #7b3c1c;
    }

    .product-desc {
      color: #bf7a54;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* ===== 产品详细介绍页 ===== */
    .detail-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.8rem;
    }

    .detail-icon {
      width: 70px;      
      height: 70px;        
      overflow: hidden; 
      font-size: 3.5rem;
      background: #fbe6d0;
      border-radius: 2rem;
      padding: 0.5rem;
    }

    .detail-name {
      font-size: 2.2rem;
      font-weight: bold;
      color: #933e1f;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin: 1.5rem 0 1rem;
    }

    .tab-btn {
      background: #ffeada;
      border: 1px solid #e5ae7c;
      color: #7b4a2c;
      padding: 0.7rem 1.5rem;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: #fff3e6;
    }

    .tab-btn:hover {
      background: #fddbb8;
      border-color: #c5682c;
    }

    .tab-btn.active {
      background: #c2552c;
      border-color: #a3431c;
      color: white;
      box-shadow: 0 6px 12px rgba(180, 70, 10, 0.4);
    }

    .detail-content-box {
      background: #fffbf5;
      border-radius: 2rem;
      padding: 1.3rem 1.2rem;
      margin-top: 0.5rem;
      box-shadow: inset 0 2px 10px rgba(190, 130, 70, 0.15);
      border: 1px solid #f3d5b5;
      min-height: 140px;
      color: #4d2e1b;
      font-size: 1rem;
      line-height: 1.7;
      white-space: pre-wrap;
      transition: 0.2s;
    }

    .detail-content-box p {
      margin: 0;
    }

    .extra-note {
      margin-top: 1rem;
      font-style: italic;
      color: #b3643a;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    hr {
      border: 0.5px solid #edd3bb;
      margin: 1rem 0 0.5rem;
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- 首页视图 -->
  <div id="homeView" class="view active">
    <div class="welcome-content">
      <div class="welcome-icon">✨</div>
      <h1>琦香缘</h1>
      <div class="welcome-sub">宣传语</div>
      <button class="enter-btn" id="enterDetailBtn">
        <span> 进入详情</span>
      </button>
      <div style="font-size: 0.9rem; color: #bc7a5c; margin-top: 0.2rem;">点击开启美食之旅</div>
    </div>
  </div>

  <!-- 详情页视图（多个产品图片/卡片） -->
  <div id="listView" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToHomeBtn">← 返回</button>
      <span class="section-title">我们的菜品</span>
    </div>
  <!-- 搜索框 -->
<div style="margin: 1rem 0 1.2rem;">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="🔍 搜索产品名称..." 
    style="
      width: 100%;
      padding: 0.8rem 1.2rem;
      border: 1px solid #e5ae7c;
      border-radius: 2rem;
      font-size: 1rem;
      background: #fffbf5;
      color: #7b4a2c;
      outline: none;
      transition: 0.2s;
    "
    onfocus="this.style.borderColor='#c2552c'"
    onblur="this.style.borderColor='#e5ae7c'"
  >
</div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- 产品详细介绍视图 -->
  <div id="detailView" class="view">
    <div class="back-row">
      <button class="back-btn" id="backToListBtn">← 返回</button>
      <span class="section-title" id="detailTitle">产品详情</span>
    </div>
    <div class="detail-header">
      <span class="detail-icon" id="detailEmoji">✨</span>
      <span class="detail-name" id="detailProductName">产品详情</span>
    </div>
    <!-- 原料、做法等按钮 -->
    <div class="button-group" id="tabButtonGroup"></div>
    <div class="detail-content-box" id="detailContentText">
      请点击上方按钮查看介绍
    </div>
    <div class="extra-note">
      <span>✨</span> 纯天然·无添加
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- 产品数据定义 -----
    const products = [
      {
        id: 1,
        name: '产品1',
        img: 'https://example.com/产品1.jpg',
        desc: '特色',
        details: {
          '原料': '原料描述',
          '做法': '第一行\n第二行\n第三行\n第四行',
          '口感': '口感描述',
          '适合人群': '举例'
        }
      },
      {
        id: 2,
        name: '产品2',
        img: 'https://example.com/产品2.jpg',
        desc: '特色',
        details: {
          '原料': '原料描述',
          '做法': '第一行\n第二行\n第三行\n第四行',
          '口感': '口感描述',
          '适合人群': '举例'
        }
      },
      {
        id: 3,
        name: '产品3',
        img: 'https://example.com/产品3.jpg',
        desc: '特色',
        details: {
          '原料': '原料描述',
          '做法': '第一行\n第二行\n第三行\n第四行',
          '口感': '口感描述',
          '适合人群': '举例'
        }
      },
      {
        id: 4,
        name: '产品4',
        img: 'https://example.com/产品4.jpg',
        desc: '特色',
        details: {
          '原料': '原料描述',
          '做法': '第一行\n第二行\n第三行\n第四行',
          '口感': '口感描述',
          '适合人群': '举例'
        }
      },
      {
        id: 5,
        name: '产品5',
        img: 'https://example.com/产品5.jpg',
        desc: '特色',
        details: {
          '原料': '原料描述',
          '做法': '第一行\n第二行\n第三行\n第四行',
          '口感': '口感描述',
          '适合人群': '举例'
        }
      },
      {
        id: 6,
        name: '产品6',
        img: 'https://example.com/产品6.jpg',
        desc: '特色',
        details: {
          '原料': '原料描述',
          '做法': '第一行\n第二行\n第三行\n第四行',
          '口感': '口感描述',
          '适合人群': '举例'
        }
      }
    ];

    let currentProductId = 1;

    const homeView = document.getElementById('homeView');
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    
    const enterDetailBtn = document.getElementById('enterDetailBtn');
    const backToHomeBtn = document.getElementById('backToHomeBtn');
    const backToListBtn = document.getElementById('backToListBtn');
    
    const productGrid = document.getElementById('productGrid');
    const detailEmoji = document.getElementById('detailEmoji');
    const detailProductName = document.getElementById('detailProductName');
    const tabButtonGroup = document.getElementById('tabButtonGroup');
    const detailContentText = document.getElementById('detailContentText');
    const searchInput = document.getElementById('searchInput');

    function showView(viewElement) {
      homeView.classList.remove('active');
      listView.classList.remove('active');
      detailView.classList.remove('active');
      viewElement.classList.add('active');
    }

    // 渲染产品列表（支持搜索筛选）
    function renderProductList(filterText = '') {
      if (!productGrid) return;
      productGrid.innerHTML = '';
      
      const filteredProducts = products.filter(product => {
        if (!filterText) return true;
        return product.name.includes(filterText) || product.desc.includes(filterText);
      });
      
      if (filteredProducts.length === 0) {
        productGrid.innerHTML = `
          <div style="text-align:center; padding:2rem; color:#bf7a54; font-size:1.1rem;">
            😕 没有找到相关产品
          </div>
        `;
        return;
      }
      
      filteredProducts.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.setAttribute('data-id', product.id);
        card.innerHTML = `
          <div class="product-img">
             <img src="${product.img}" style="width:100%; height:100%; object-fit:cover; border-radius:1.8rem;">
          </div>
             <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-desc">${product.desc}</div>
          </div>
          <div style="font-size:1.5rem; color:#c2845c;">›</div>
        `;
        card.addEventListener('click', (e) => {
          const productId = parseInt(card.getAttribute('data-id'), 10);
          openProductDetail(productId);
        });
        productGrid.appendChild(card);
      });
    }

    function getProductById(id) {
      return products.find(p => p.id === id) || products[0];
    }

    function openProductDetail(productId) {
      const product = getProductById(productId);
      if (!product) return;
      currentProductId = productId;
      
      detailEmoji.innerHTML = `<img src="${product.img}" style="width:100%; height:100%; object-fit:cover; border-radius:2rem;">`;
      detailProductName.textContent = product.name;
      
      renderDetailTabs(product);
      detailContentText.textContent = '请点击上方按钮查看详细介绍';
      
      showView(detailView);
    }

    function renderDetailTabs(product) {
      if (!tabButtonGroup) return;
      tabButtonGroup.innerHTML = '';
      const detailKeys = Object.keys(product.details);
      if (detailKeys.length === 0) {
        tabButtonGroup.innerHTML = '<span style="color:#7b4a2c;">暂无详细介绍</span>';
        detailContentText.textContent = '暂无内容';
        return;
      }
      
      detailKeys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.textContent = key;
        btn.setAttribute('data-tab-key', key);
        btn.addEventListener('click', function(e) {
          document.querySelectorAll('#tabButtonGroup .tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const content = product.details[key] || '暂无详细介绍';
          detailContentText.textContent = content;
        });
        tabButtonGroup.appendChild(btn);
      });
    }

    function goBackToList() {
      showView(listView);
    }

    // ===== 事件绑定 =====
    
    // 搜索框实时筛选
    if (searchInput) {
      searchInput.addEventListener('input', function(e) {
        renderProductList(e.target.value);
      });
    }

    enterDetailBtn.addEventListener('click', () => {
      renderProductList();
      showView(listView);
    });

    backToHomeBtn.addEventListener('click', () => {
      showView(homeView);
    });

    backToListBtn.addEventListener('click', () => {
      goBackToList();
    });

    // 初始加载
    renderProductList();

    console.log('美食即将到来！点击首页按钮进入美食世界。');
  })();
</script>
</body>
</html>
